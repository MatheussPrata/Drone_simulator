name: Build Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configurar espelho Maven Central e retries do Gradle
        run: |
          mkdir -p ~/.gradle/init.d
          cat <<'EOF' > ~/.gradle/init.d/maven-mirror.gradle
          def mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2/"
          def rewriteRepos = { repos ->
            repos.all { repo ->
              if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
                def u = repo.url.toString()
                if (u.contains("repo.maven.apache.org/maven2") || u.contains("repo1.maven.org/maven2")) {
                  repo.setUrl(mirrorUrl)
                }
              }
            }
          }

          gradle.settingsEvaluated { settings ->
            rewriteRepos(settings.pluginManagement.repositories)
            rewriteRepos(settings.dependencyResolutionManagement.repositories)
          }

          gradle.allprojects { project ->
            rewriteRepos(project.buildscript.repositories)
            rewriteRepos(project.repositories)
          }
          EOF
          cat <<'EOF' >> ~/.gradle/gradle.properties
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          org.gradle.internal.repository.max.tentatives=5
          org.gradle.internal.repository.initial.backoff=2000
          EOF

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test -j 1

      - name: Restaurar keystore (se configurado)
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks

      - name: Gerar keystore de debug (sem secrets)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Build APK (release assinado)
        run: |
          flutter build apk --release \
            --build-name="1.0.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}"
        env:
          KEYSTORE_PATH: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build AppBundle (AAB assinado)
        run: |
          flutter build appbundle --release \
            --build-name="1.0.${{ github.run_number }}" \
            --build-number="${{ github.run_number }}"
        env:
          KEYSTORE_PATH: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Limpar keystore
        if: always()
        run: rm -f android/app/release.jks

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
