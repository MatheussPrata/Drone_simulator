<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>Drone Simulator 3D World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b1118;
      touch-action: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    .map-banner {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      background: rgba(10, 16, 24, 0.82);
      border: 1px solid rgba(0, 229, 255, 0.55);
      color: #e6f7ff;
      padding: 6px 16px;
      border-radius: 999px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .map-banner.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <script src="three.min.js"></script>
  <script>
    (function () {
      'use strict';

      // ── Estado Global do Drone ──
      var droneState = {
        x: 0.0,
        y: 0.0,
        z: 0.0,
        yaw: 0.0,
        pitch: 0.0,
        roll: 0.0,
        visualPitch: 0.0,
        visualRoll: 0.0,
        gimbalPitch: 0.0,
        cameraMode: 'fpv', // 'fpv' ou 'thirdPerson'
        flightMode: 'stabilized',
        fpvUptiltDeg: 12.0,
        audioEnabled: true,
        speedKmh: 0.0,
        flying: false,
        battery: 100.0,
        impactShake: 0.0,
        motors: [0.0, 0.0, 0.0, 0.0],
        pitchRad: 0.0,
        rollRad: 0.0,
        yawRad: 0.0,
        qx: 0.0,
        qy: 0.0,
        qz: 0.0,
        qw: 1.0,
        ghost: { active: false },
        isCrashed: false,
        crashImpactSpeedKmh: 0.0,
        isArmed: false,
        status: 'landed'
      };

      var currentScenario = 'urban';
      var currentTheme = { sky: '#8cb5df', fogDensity: 0.0015, ground: '#ffffff', water: false };
      var currentLightingPreset = 'day';

      // ── Sintetizador Web Audio Offline (motores + efeitos de jogo) ──
      var AudioEngine = (function () {
        var ctx = null;
        var masterGain = null;
        var motorGain = null;
        var oscMain = null;
        var oscSub = null;
        var initialized = false;

        function ensureInit() {
          if (initialized) return true;
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return false;
          try {
            ctx = new AC();
            masterGain = ctx.createGain();
            masterGain.gain.value = 0.25;
            masterGain.connect(ctx.destination);

            motorGain = ctx.createGain();
            motorGain.gain.value = 0.0;

            var filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 520;
            motorGain.connect(filter);
            filter.connect(masterGain);

            oscMain = ctx.createOscillator();
            oscMain.type = 'sawtooth';
            oscMain.frequency.value = 95;
            oscMain.connect(motorGain);
            oscMain.start();

            oscSub = ctx.createOscillator();
            oscSub.type = 'triangle';
            oscSub.frequency.value = 190;
            var subGain = ctx.createGain();
            subGain.gain.value = 0.35;
            oscSub.connect(subGain);
            subGain.connect(motorGain);
            oscSub.start();

            initialized = true;
            return true;
          } catch (e) {
            return false;
          }
        }

        function resumeIfNeeded() {
          if (!ctx && droneState.audioEnabled) ensureInit();
          if (ctx && ctx.state === 'suspended') {
            ctx.resume().catch(function () {});
          }
        }

        function updateMotors(motors, isArmed, isCrashed, enabled) {
          if (!enabled || !isArmed || isCrashed) {
            if (motorGain && ctx) {
              motorGain.gain.setTargetAtTime(0.0, ctx.currentTime, 0.06);
            }
            return;
          }
          resumeIfNeeded();
          if (!initialized || !ctx) return;

          var avg = ((motors[0] || 0) + (motors[1] || 0) + (motors[2] || 0) + (motors[3] || 0)) * 0.25;
          var spread = Math.abs((motors[0] || 0) - (motors[1] || 0)) + Math.abs((motors[2] || 0) - (motors[3] || 0));
          var freq = 88 + avg * 210 + spread * 45;
          var vol = 0.04 + avg * 0.14;
          oscMain.frequency.setTargetAtTime(freq, ctx.currentTime, 0.04);
          oscSub.frequency.setTargetAtTime(freq * 1.98, ctx.currentTime, 0.04);
          motorGain.gain.setTargetAtTime(vol, ctx.currentTime, 0.05);
        }

        function playTone(freq, duration, type, gainVal, slideTo) {
          resumeIfNeeded();
          if (!initialized || !ctx || !droneState.audioEnabled) return;
          try {
            var now = ctx.currentTime;
            var osc = ctx.createOscillator();
            var g = ctx.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, now);
            if (slideTo) {
              osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), now + duration);
            }
            g.gain.setValueAtTime(gainVal || 0.2, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + duration);
            osc.connect(g);
            g.connect(masterGain);
            osc.start(now);
            osc.stop(now + duration + 0.02);
          } catch (e) {}
        }

        function triggerEffect(kind, value) {
          if (!droneState.audioEnabled) return;
          switch (kind) {
            case 'gate':
              var baseFreq = 520 + Math.min(6, Number(value) || 1) * 75;
              playTone(baseFreq, 0.12, 'triangle', 0.28, baseFreq * 1.35);
              break;
            case 'trick':
              playTone(620, 0.10, 'sine', 0.22, 880);
              setTimeout(function () { playTone(920, 0.16, 'triangle', 0.22, 1180); }, 70);
              break;
            case 'warning':
              playTone(760, 0.09, 'square', 0.12, 620);
              break;
            case 'crash':
              playTone(150, 0.32, 'sawtooth', 0.35, 38);
              break;
            case 'finish':
              playTone(523, 0.14, 'triangle', 0.24);
              setTimeout(function () { playTone(659, 0.14, 'triangle', 0.24); }, 110);
              setTimeout(function () { playTone(784, 0.28, 'triangle', 0.28); }, 220);
              break;
          }
        }

        return {
          updateMotors: updateMotors,
          triggerEffect: triggerEffect
        };
      })();

      window.triggerSoundEffect = function (kind, value) {
        AudioEngine.triggerEffect(kind, value);
      };

      // ── Cena, Câmera e Renderizador Three.js ──
      var container = document.getElementById('canvas-container');
      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0x8cb5df);
      scene.fog = new THREE.FogExp2(0x8cb5df, 0.0015);

      var camera = new THREE.PerspectiveCamera(64, window.innerWidth / window.innerHeight, 0.1, 2200);
      camera.rotation.order = 'YXZ';
      camera.position.set(0, 1.8, 4.5);

      var renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      container.appendChild(renderer.domElement);

      // ── Iluminação Atmosférica e Ciclo Dia/Pôr do Sol/Noite ──
      var hemiLight = new THREE.HemisphereLight(0xdff0ff, 0x3d502a, 0.65);
      hemiLight.position.set(0, 500, 0);
      scene.add(hemiLight);

      var sunLight = new THREE.DirectionalLight(0xfffaee, 1.25);
      sunLight.position.set(160, 340, 180);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      sunLight.shadow.camera.near = 10;
      sunLight.shadow.camera.far = 1000;
      sunLight.shadow.camera.left = -450;
      sunLight.shadow.camera.right = 450;
      sunLight.shadow.camera.top = 450;
      sunLight.shadow.camera.bottom = -450;
      sunLight.shadow.bias = -0.0003;
      scene.add(sunLight);

      var droneHeadlight = new THREE.PointLight(0xdff6ff, 0.0, 48, 1.6);
      scene.add(droneHeadlight);

      // ── Texturas Procedurais Específicas por Cenário ──
      var groundTextureCache = {};

      function createGroundTexture(scenario) {
        if (groundTextureCache[scenario]) return groundTextureCache[scenario];

        var size = 2048;
        var canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        var ctx = canvas.getContext('2d');
        var scale = size / 1600.0;
        var centerX = size / 2;
        var centerY = size / 2;

        if (scenario === 'forest') {
          var fGrad = ctx.createRadialGradient(centerX, centerY, 40, centerX, centerY, size * 0.7);
          fGrad.addColorStop(0, '#4e7f34');
          fGrad.addColorStop(0.45, '#3f6d2b');
          fGrad.addColorStop(1, '#2f5620');
          ctx.fillStyle = fGrad;
          ctx.fillRect(0, 0, size, size);

          for (var fi = 0; fi < 280; fi++) {
            var fx = (Math.sin(fi * 887) * 0.5 + 0.5) * size;
            var fy = (Math.cos(fi * 541) * 0.5 + 0.5) * size;
            ctx.fillStyle = fi % 2 === 0 ? 'rgba(85, 130, 50, 0.26)' : 'rgba(42, 78, 26, 0.25)';
            ctx.beginPath();
            ctx.ellipse(fx, fy, 26 + (fi % 70), 20 + (fi % 55), fi * 0.5, 0, Math.PI * 2);
            ctx.fill();
          }

          // Trilhas de terra em cruz + clareira central natural
          ctx.fillStyle = '#8b6d4b';
          var trailW = 16 * scale;
          ctx.fillRect(centerX - trailW / 2, 0, trailW, size);
          ctx.fillRect(0, centerY - trailW / 2, size, trailW);

          ctx.strokeStyle = '#7b5f40';
          ctx.lineWidth = 10 * scale;
          ctx.beginPath();
          ctx.arc(centerX, centerY, 210 * scale, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = '#9a7e5a';
          ctx.beginPath();
          ctx.arc(centerX, centerY, 28 * scale, 0, Math.PI * 2);
          ctx.fill();
        } else if (scenario === 'canyon') {
          var cGrad = ctx.createRadialGradient(centerX, centerY, 50, centerX, centerY, size * 0.72);
          cGrad.addColorStop(0, '#c89b6e');
          cGrad.addColorStop(0.55, '#b68558');
          cGrad.addColorStop(1, '#8c5f3c');
          ctx.fillStyle = cGrad;
          ctx.fillRect(0, 0, size, size);

          for (var ci = 0; ci < 240; ci++) {
            var cx = (Math.sin(ci * 733) * 0.5 + 0.5) * size;
            var cy = (Math.cos(ci * 499) * 0.5 + 0.5) * size;
            ctx.fillStyle = ci % 2 === 0 ? 'rgba(155, 102, 62, 0.25)' : 'rgba(218, 178, 132, 0.22)';
            ctx.beginPath();
            ctx.ellipse(cx, cy, 40 + (ci % 90), 18 + (ci % 40), ci * 0.35, 0, Math.PI * 2);
            ctx.fill();
          }

          // Plataforma arenosa e pátio de concreto junto à barragem
          ctx.fillStyle = '#d7b98e';
          ctx.beginPath();
          ctx.arc(centerX, centerY, 55 * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#7e8388';
          ctx.fillRect(centerX - 360 * scale, centerY - 310 * scale, 48 * scale, 620 * scale);
        } else {
          // Distrito Urbano: quadras de concreto, avenidas asfaltadas e parques verdes
          ctx.fillStyle = '#4e565e';
          ctx.fillRect(0, 0, size, size);

          for (var ui = 0; ui < 16; ui++) {
            for (var uj = 0; uj < 16; uj++) {
              var bx = ui * (size / 16) + 8;
              var by = uj * (size / 16) + 8;
              var bw = size / 16 - 16;
              ctx.fillStyle = ((ui + uj) % 5 === 0) ? '#4b7843' : '#636c75';
              ctx.fillRect(bx, by, bw, bw);
            }
          }

          var roadW = 24 * scale;
          ctx.fillStyle = '#25292e';
          ctx.fillRect(centerX - roadW / 2, 0, roadW, size);
          ctx.fillRect(0, centerY - roadW / 2, size, roadW);

          var ringRadius = 240 * scale;
          ctx.strokeStyle = '#25292e';
          ctx.lineWidth = 16 * scale;
          ctx.beginPath();
          ctx.arc(centerX, centerY, ringRadius, 0, Math.PI * 2);
          ctx.stroke();

          ctx.strokeStyle = '#e6b800';
          ctx.lineWidth = 2.0 * scale;
          ctx.setLineDash([8 * scale, 8 * scale]);
          ctx.beginPath();
          ctx.moveTo(centerX, 0);
          ctx.lineTo(centerX, size);
          ctx.moveTo(0, centerY);
          ctx.lineTo(size, centerY);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        var texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.ClampToEdgeWrapping;
        texture.wrapT = THREE.ClampToEdgeWrapping;
        groundTextureCache[scenario] = texture;
        return texture;
      }

      var groundGeo = new THREE.PlaneGeometry(1600, 1600);
      groundGeo.rotateX(-Math.PI / 2);
      var groundMat = new THREE.MeshStandardMaterial({
        map: createGroundTexture('urban'),
        roughness: 0.88,
        metalness: 0.08
      });
      var ground = new THREE.Mesh(groundGeo, groundMat);
      ground.receiveShadow = true;
      scene.add(ground);

      var gridHelper = new THREE.GridHelper(1600, 80, 0x6e9060, 0x5a7850);
      gridHelper.position.y = 0.02;
      gridHelper.material.transparent = true;
      gridHelper.material.opacity = 0.25;
      scene.add(gridHelper);

      // ── Espelho d'água da represa (visível só no cenário Cânion & Represa) ──
      var waterGeo = new THREE.PlaneGeometry(920, 580, 24, 16);
      waterGeo.rotateX(-Math.PI / 2);
      var waterMat = new THREE.MeshStandardMaterial({
        color: 0x1d6f8f,
        transparent: true,
        opacity: 0.86,
        roughness: 0.12,
        metalness: 0.55
      });
      var waterMesh = new THREE.Mesh(waterGeo, waterMat);
      waterMesh.position.set(10, 0.09, 250);
      waterMesh.receiveShadow = true;
      waterMesh.visible = false;
      scene.add(waterMesh);

      function applyLightingAndTheme() {
        var baseSky = new THREE.Color(currentTheme.sky || '#8cb5df');
        var baseFogDensity = typeof currentTheme.fogDensity === 'number' ? currentTheme.fogDensity : 0.0015;

        if (currentLightingPreset === 'night') {
          scene.background = new THREE.Color(0x0b1526);
          if (scene.fog) {
            scene.fog.color.setHex(0x0b1526);
            scene.fog.density = baseFogDensity * 1.45;
          }
          hemiLight.color.setHex(0x3a588a);
          hemiLight.groundColor.setHex(0x101820);
          hemiLight.intensity = 0.35;
          sunLight.color.setHex(0x8db0e0);
          sunLight.intensity = 0.42;
          sunLight.position.set(-140, 260, -160);
          renderer.toneMappingExposure = 0.92;
          gridHelper.material.opacity = 0.14;
        } else if (currentLightingPreset === 'sunset') {
          var sunsetSky = baseSky.clone().lerp(new THREE.Color(0xe88d5d), 0.65);
          scene.background = sunsetSky;
          if (scene.fog) {
            scene.fog.color.copy(sunsetSky);
            scene.fog.density = baseFogDensity * 1.25;
          }
          hemiLight.color.setHex(0xffc99e);
          hemiLight.groundColor.setHex(0x473026);
          hemiLight.intensity = 0.58;
          sunLight.color.setHex(0xff9c52);
          sunLight.intensity = 1.35;
          sunLight.position.set(-280, 120, 220);
          renderer.toneMappingExposure = 1.08;
          gridHelper.material.opacity = 0.22;
        } else {
          scene.background = baseSky;
          if (scene.fog) {
            scene.fog.color.copy(baseSky);
            scene.fog.density = baseFogDensity;
          }
          hemiLight.color.setHex(0xdff0ff);
          hemiLight.groundColor.setHex(0x3d502a);
          hemiLight.intensity = 0.65;
          sunLight.color.setHex(0xfffaee);
          sunLight.intensity = 1.25;
          sunLight.position.set(160, 340, 180);
          renderer.toneMappingExposure = 1.05;
          gridHelper.material.opacity = 0.25;
        }
      }

      window.setLightingPreset = function (preset) {
        currentLightingPreset = preset || 'day';
        applyLightingAndTheme();
      };

      /// Aplica céu, neblina, cor do solo e água do cenário escolhido.
      function applyScenarioTheme(theme, scenario) {
        if (theme) currentTheme = theme;
        if (scenario) currentScenario = scenario;

        if (ground && ground.material) {
          ground.material.map = createGroundTexture(currentScenario);
          ground.material.color.set('#ffffff');
          ground.material.needsUpdate = true;
        }
        waterMesh.visible = !!(theme && theme.water);
        applyLightingAndTheme();
      }

      // ── Heliponto Home (0, 0, 0) com "H" Amarelo e Balizamento ──
      function createHelipad() {
        var helipadGroup = new THREE.Group();
        helipadGroup.position.set(0, 0.03, 0);

        var padGeo = new THREE.CylinderGeometry(7.0, 7.2, 0.08, 36);
        var padMat = new THREE.MeshStandardMaterial({
          color: 0x484d52,
          roughness: 0.8,
          metalness: 0.15
        });
        var pad = new THREE.Mesh(padGeo, padMat);
        pad.receiveShadow = true;
        helipadGroup.add(pad);

        var ringGeo = new THREE.RingGeometry(5.2, 5.6, 36);
        ringGeo.rotateX(-Math.PI / 2);
        var yellowMat = new THREE.MeshBasicMaterial({
          color: 0xffcc00,
          side: THREE.DoubleSide
        });
        var ring = new THREE.Mesh(ringGeo, yellowMat);
        ring.position.y = 0.045;
        helipadGroup.add(ring);

        var hBarGeo1 = new THREE.PlaneGeometry(0.7, 4.4);
        hBarGeo1.rotateX(-Math.PI / 2);
        var barLeft = new THREE.Mesh(hBarGeo1, yellowMat);
        barLeft.position.set(-1.4, 0.046, 0);
        helipadGroup.add(barLeft);

        var barRight = new THREE.Mesh(hBarGeo1, yellowMat);
        barRight.position.set(1.4, 0.046, 0);
        helipadGroup.add(barRight);

        var hBarGeo2 = new THREE.PlaneGeometry(2.1, 0.7);
        hBarGeo2.rotateX(-Math.PI / 2);
        var barCross = new THREE.Mesh(hBarGeo2, yellowMat);
        barCross.position.set(0, 0.047, 0);
        helipadGroup.add(barCross);

        var beaconMatGreen = new THREE.MeshBasicMaterial({ color: 0x00ff66 });
        var beaconMatAmber = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        var beaconPositions = [
          { x: 5.8, z: 0, mat: beaconMatGreen },
          { x: -5.8, z: 0, mat: beaconMatGreen },
          { x: 0, z: 5.8, mat: beaconMatAmber },
          { x: 0, z: -5.8, mat: beaconMatAmber },
          { x: 4.1, z: 4.1, mat: beaconMatAmber },
          { x: -4.1, z: 4.1, mat: beaconMatAmber },
          { x: 4.1, z: -4.1, mat: beaconMatAmber },
          { x: -4.1, z: -4.1, mat: beaconMatAmber }
        ];

        var beaconPostGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8);
        var beaconCapGeo = new THREE.SphereGeometry(0.14, 8, 8);
        var postMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });

        beaconPositions.forEach(function (bp) {
          var post = new THREE.Mesh(beaconPostGeo, postMat);
          post.position.set(bp.x, 0.2, bp.z);
          helipadGroup.add(post);

          var cap = new THREE.Mesh(beaconCapGeo, bp.mat);
          cap.position.set(bp.x, 0.42, bp.z);
          helipadGroup.add(cap);
        });

        scene.add(helipadGroup);
      }
      createHelipad();

      // ── Obstáculos e Props Decorativos do Cenário ──
      var obstaclesGroup = new THREE.Group();
      scene.add(obstaclesGroup);
      var scenarioPropsGroup = new THREE.Group();
      scene.add(scenarioPropsGroup);

      var buildingColors = [0x4a6572, 0x34495e, 0x2c3e50, 0x5d6d7e, 0x7f8c8d, 0x95a5a6, 0x3a4b53, 0x2e4053];
      var roofColors = [0x22313f, 0x1a252f, 0x283747, 0x212f3d];

      function makeFacadeTexture(baseColorHex, litOffset) {
        var canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 512;
        var ctx = canvas.getContext('2d');

        ctx.fillStyle = '#' + ('000000' + baseColorHex.toString(16)).slice(-6);
        ctx.fillRect(0, 0, 256, 512);

        var rows = 16;
        var cols = 8;
        var w = 18;
        var h = 18;
        var padX = (256 - cols * w) / (cols + 1);
        var padY = (512 - rows * h) / (rows + 1);

        for (var r = 0; r < rows; r++) {
          for (var c = 0; c < cols; c++) {
            var x = padX + c * (w + padX);
            var y = padY + r * (h + padY);
            var lightUp = ((r * 7 + c * 3 + litOffset) % 5) < 2;
            ctx.fillStyle = lightUp ? 'rgba(255, 240, 170, 0.85)' : 'rgba(24, 38, 52, 0.90)';
            ctx.fillRect(x, y, w, h);
          }
        }

        var tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }

      var facadeTextures = buildingColors.map(function (c, i) {
        return makeFacadeTexture(c, i * 2);
      });

      var trunkGeo = new THREE.CylinderGeometry(0.35, 0.55, 3.2, 6);
      var trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });

      var foliageGeo1 = new THREE.ConeGeometry(2.8, 5.5, 6);
      var foliageGeo2 = new THREE.ConeGeometry(2.2, 4.2, 6);
      var crownGeo = new THREE.DodecahedronGeometry(2.4, 1);
      var foliageMats = [
        new THREE.MeshStandardMaterial({ color: 0x2e6b2e, roughness: 0.8 }),
        new THREE.MeshStandardMaterial({ color: 0x3d7e3d, roughness: 0.8 }),
        new THREE.MeshStandardMaterial({ color: 0x245824, roughness: 0.8 }),
        new THREE.MeshStandardMaterial({ color: 0x548538, roughness: 0.8 })
      ];

      var rockMat = new THREE.MeshStandardMaterial({ color: 0x7d6552, roughness: 0.95, flatShading: true });
      var concreteMat = new THREE.MeshStandardMaterial({ color: 0x9aa0a6, roughness: 0.85 });
      var woodMat = new THREE.MeshStandardMaterial({ color: 0x7a5233, roughness: 0.88 });
      var roofMatCache = roofColors.map(function (c) {
        return new THREE.MeshStandardMaterial({ color: c, roughness: 0.9 });
      });

      function clearGroup(group) {
        while (group.children.length > 0) {
          var child = group.children.pop();
          if (child.geometry) child.geometry.dispose();
        }
      }

      function addBox(o, mat, extraHeight) {
        extraHeight = extraHeight || 0;
        var geo = new THREE.BoxGeometry(o.width, o.height + extraHeight, o.depth);
        var mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(o.x, (o.height + extraHeight) / 2, -o.y);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        obstaclesGroup.add(mesh);
        return mesh;
      }

      function addBuilding(o) {
        var colorIdx = Math.abs(Math.round(o.x + o.y)) % buildingColors.length;
        var mat = new THREE.MeshStandardMaterial({
          map: facadeTextures[colorIdx],
          roughness: 0.62,
          metalness: 0.22
        });
        addBox(o, mat);

        if (((Math.round(o.height) + Math.round(o.x)) % 3) !== 0) {
          var roofGeo = new THREE.BoxGeometry(o.width * 0.42, 3, o.depth * 0.42);
          var roof = new THREE.Mesh(roofGeo, roofMatCache[colorIdx % roofMatCache.length]);
          roof.position.set(o.x, o.height + 1.5, -o.y);
          roof.castShadow = true;
          obstaclesGroup.add(roof);
        }
        if (o.height > 58) {
          var ant = new THREE.Mesh(
            new THREE.CylinderGeometry(0.18, 0.28, 7.0, 6),
            concreteMat
          );
          ant.position.set(o.x, o.height + 3.5, -o.y);
          obstaclesGroup.add(ant);
          var warn = new THREE.Mesh(
            new THREE.SphereGeometry(0.45, 8, 8),
            new THREE.MeshBasicMaterial({ color: 0xff2222 })
          );
          warn.position.set(o.x, o.height + 7.1, -o.y);
          obstaclesGroup.add(warn);
        }
      }

      function addTree(o) {
        var group = new THREE.Group();
        group.position.set(o.x, 0, -o.y);
        var scale = Math.max(0.5, o.height / 9.5);
        group.scale.set(scale, scale, scale);

        var trunk = new THREE.Mesh(trunkGeo, trunkMat);
        trunk.position.y = 1.6;
        trunk.castShadow = true;
        group.add(trunk);

        var seedIdx = Math.abs(Math.round(o.x * 0.1 + o.y * 0.1));
        var folMat = foliageMats[seedIdx % foliageMats.length];

        if (currentScenario === 'forest' && (seedIdx % 3 === 0)) {
          var crown = new THREE.Mesh(crownGeo, folMat);
          crown.position.y = 5.4;
          crown.scale.set(1.1, 1.25, 1.1);
          crown.castShadow = true;
          group.add(crown);
        } else {
          var bottom = new THREE.Mesh(foliageGeo1, folMat);
          bottom.position.y = 4.8;
          bottom.castShadow = true;
          group.add(bottom);

          var top = new THREE.Mesh(foliageGeo2, folMat);
          top.position.y = 7.2;
          top.castShadow = true;
          group.add(top);
        }

        obstaclesGroup.add(group);
      }

      function addTower(o) {
        var isWood = currentScenario === 'forest';
        var sections = 6;
        var secH = o.height / sections;
        for (var s = 0; s < sections; s++) {
          var rTop = 2.4 * (1 - (s + 1) / (sections + 1));
          var rBot = 2.4 * (1 - s / (sections + 1));
          var geo = new THREE.CylinderGeometry(rTop, rBot, secH, 4, 1, true);
          var mat = isWood
            ? woodMat
            : new THREE.MeshStandardMaterial({
                color: s % 2 === 0 ? 0xdd3333 : 0xeeeeee,
                metalness: 0.6,
                roughness: 0.4
              });
          var mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(o.x, secH * (s + 0.5), -o.y);
          mesh.castShadow = true;
          obstaclesGroup.add(mesh);
        }

        var beacon = new THREE.Mesh(
          new THREE.SphereGeometry(0.6, 8, 8),
          new THREE.MeshBasicMaterial({ color: isWood ? 0xffbb33 : 0xff0000 })
        );
        beacon.position.set(o.x, o.height + 0.5, -o.y);
        obstaclesGroup.add(beacon);
      }

      function addRock(o) {
        var radius = Math.max(1.0, o.radius);
        var geo = new THREE.DodecahedronGeometry(radius, 0);
        var mesh = new THREE.Mesh(geo, rockMat);
        mesh.scale.set(1.0, Math.max(0.7, o.height / (radius * 2)), 1.0);
        mesh.position.set(o.x, o.height * 0.45, -o.y);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        obstaclesGroup.add(mesh);
      }

      function populateScenarioProps(scenario) {
        clearGroup(scenarioPropsGroup);

        if (scenario === 'canyon') {
          // Tabuleiro da ponte passando sobre os 6 pilares em y = -60 (Three.js z = +60, altura = 26)
          var deckMat = new THREE.MeshStandardMaterial({ color: 0x626970, roughness: 0.85 });
          var deck = new THREE.Mesh(new THREE.BoxGeometry(430, 1.4, 11), deckMat);
          deck.position.set(-5, 26.6, 60);
          deck.castShadow = true;
          deck.receiveShadow = true;
          scenarioPropsGroup.add(deck);

          var railMat = new THREE.MeshStandardMaterial({ color: 0xdfe4ea, metalness: 0.6 });
          [-5.2, 5.2].forEach(function (rz) {
            var rail = new THREE.Mesh(new THREE.BoxGeometry(430, 1.0, 0.3), railMat);
            rail.position.set(-5, 27.8, 60 + rz);
            scenarioPropsGroup.add(rail);
          });

          // Anel de paredões rochosos do cânion na borda externa (~525m)
          var cliffMat = new THREE.MeshStandardMaterial({ color: 0x8f5b3c, roughness: 0.96, flatShading: true });
          for (var c = 0; c < 24; c++) {
            var ang = (c / 24) * Math.PI * 2;
            var dist = 528;
            var cw = 90 + (c % 3) * 28;
            var ch = 46 + (c % 5) * 14;
            var cliff = new THREE.Mesh(new THREE.ConeGeometry(cw, ch, 5), cliffMat);
            cliff.position.set(Math.cos(ang) * dist, ch * 0.45, Math.sin(ang) * dist);
            cliff.rotation.y = ang;
            scenarioPropsGroup.add(cliff);
          }

          // Vertedouro branco na face da barragem
          var spill = new THREE.Mesh(
            new THREE.PlaneGeometry(80, 32),
            new THREE.MeshBasicMaterial({ color: 0xdff5ff, transparent: true, opacity: 0.55, side: THREE.DoubleSide })
          );
          spill.position.set(-317.5, 16, 0);
          spill.rotation.y = Math.PI / 2;
          scenarioPropsGroup.add(spill);
        } else if (scenario === 'urban') {
          // Transformadores na Subestação Elétrica (x=120, y=-280 -> z=+280)
          var txMat = new THREE.MeshStandardMaterial({ color: 0x3f4c56, metalness: 0.6 });
          for (var t = -1; t <= 1; t++) {
            var unit = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 6), txMat);
            unit.position.set(120 + t * 14, 2.5, 280);
            unit.castShadow = true;
            scenarioPropsGroup.add(unit);
          }
          // Postes ao longo das avenidas principais
          var poleMat = new THREE.MeshStandardMaterial({ color: 0x2f3640, metalness: 0.7 });
          var lampMat = new THREE.MeshBasicMaterial({ color: 0xffeaa7 });
          for (var p = -360; p <= 360; p += 90) {
            if (Math.abs(p) < 30) continue;
            var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.18, 7.5, 6), poleMat);
            pole.position.set(14, 3.75, p);
            scenarioPropsGroup.add(pole);
            var bulb = new THREE.Mesh(new THREE.SphereGeometry(0.35, 6, 6), lampMat);
            bulb.position.set(14, 7.6, p);
            scenarioPropsGroup.add(bulb);
          }
        }
      }

      /// Recebe a planta de obstáculos gerada pelo Dart (WorldGenerator).
      window.loadWorldObstacles = function (payload) {
        var data = payload;
        if (typeof data === 'string') {
          try {
            data = JSON.parse(data);
          } catch (e) {
            console.error('Falha ao interpretar obstáculos:', e);
            return;
          }
        }
        if (!data || !data.obstacles) return;

        clearGroup(obstaclesGroup);
        data.obstacles.forEach(function (o) {
          switch (o.type) {
            case 'building':
              addBuilding(o);
              break;
            case 'tree':
              addTree(o);
              break;
            case 'tower':
              addTower(o);
              break;
            case 'rock':
              addRock(o);
              break;
            case 'dam':
            case 'pillar':
            case 'hangar':
              addBox(o, o.type === 'hangar' && currentScenario === 'forest' ? woodMat : concreteMat);
              break;
            default:
              addBox(o, concreteMat);
              break;
          }
        });
      };

      // ── Barreira Geofence e Zonas No-Fly ──
      var nfzGroup = new THREE.Group();

          color: 0xff3333,
          side: THREE.DoubleSide
        });

        ringGround.position.y = 0.15;
        safetyGroup.add(ringGround);

        var ringTopGeo = new THREE.RingGeometry(fenceRadius - 2.0, fenceRadius + 2.0, 64);

        var nfzR = 75.0;
        var nfzH = 160.0;

        var nfzGeo = new THREE.CylinderGeometry(nfzR, nfzR, nfzH, 36, 1, true);
        var nfzMat = new THREE.MeshBasicMaterial({
          color: 0xff1100,
          transparent: true,
          opacity: 0.24,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        var nfzCylinder = new THREE.Mesh(nfzGeo, nfzMat);
        nfzCylinder.position.set(nfzX, nfzH / 2, nfzZ);
        nfzGroup.add(nfzCylinder);

        var nfzRingGeo = new THREE.RingGeometry(nfzR - 2.5, nfzR + 2.5, 36);
        nfzRingGeo.rotateX(-Math.PI / 2);
        var nfzRing = new THREE.Mesh(nfzRingGeo, new THREE.MeshBasicMaterial({ color: 0xff1100, side: THREE.DoubleSide }));
        nfzRing.position.set(nfzX, 0.18, nfzZ);
        nfzGroup.add(nfzRing);
      }
      buildGeofenceAndNoFlyZones();

      window.loadMapScenario = function (payload) {
        var data = payload;
        if (typeof data === 'string') {
          try {
            data = JSON.parse(data);
          } catch (e) {
            console.error('Falha ao interpretar o cenário:', e);
            return;
          }
        }
        if (!data) return;
        var scenario = data.scenario || 'urban';
        nfzGroup.visible = data.hasNoFlyZone !== false;
        applyScenarioTheme(data.theme, scenario);
        populateScenarioProps(scenario);
        window.loadWorldObstacles(data);
        if (data.label) window.showMapBanner(data.label);
      };

      // ── Modelo 3D do Drone + Drone Ghost ──
      var droneGroup = new THREE.Group();
      droneGroup.rotation.order = 'YXZ';
      var dronePropellers = [];

      function buildDroneMesh(targetGroup, propsOut, isGhost) {
        var opacityVal = isGhost ? 0.42 : 1.0;
        var bodyMat = isGhost
          ? new THREE.MeshBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: opacityVal })
          : new THREE.MeshStandardMaterial({ color: 0x24282c, roughness: 0.4, metalness: 0.35 });
        var accentMat = isGhost
          ? bodyMat
          : new THREE.MeshStandardMaterial({ color: 0x00d4ff, roughness: 0.3, metalness: 0.6 });
        var armMat = isGhost
          ? bodyMat
          : new THREE.MeshStandardMaterial({ color: 0x181a1c, roughness: 0.6, metalness: 0.5 });
        var motorMat = isGhost
          ? bodyMat
          : new THREE.MeshStandardMaterial({ color: 0x8a929a, roughness: 0.25, metalness: 0.85 });
        var propMat = isGhost
          ? new THREE.MeshBasicMaterial({ color: 0x80f8ff, transparent: true, opacity: 0.35 })
          : new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.3, metalness: 0.2, transparent: true, opacity: 0.85 });

        var bodyTop = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.08, 0.36), bodyMat);
        bodyTop.position.y = 0.04;
        targetGroup.add(bodyTop);

        var stripe = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.02, 0.32), accentMat);
        stripe.position.set(0, 0.085, 0);
        targetGroup.add(stripe);

        if (!isGhost) {
          var gimbalBase = new THREE.Mesh(
            new THREE.SphereGeometry(0.045, 12, 12),
            new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9 })
          );
          gimbalBase.position.set(0, -0.01, -0.19);
          targetGroup.add(gimbalBase);

          var lensMesh = new THREE.Mesh(
            new THREE.CylinderGeometry(0.02, 0.02, 0.025, 12),
            new THREE.MeshBasicMaterial({ color: 0x00ffcc })
          );
          lensMesh.rotation.x = Math.PI / 2;
          lensMesh.position.set(0, -0.01, -0.22);
          targetGroup.add(lensMesh);
        }

        var motorOffsets = [
          { x: 0.22, z: -0.20, isFront: true, isRight: true, spinDir: 1 },
          { x: -0.22, z: -0.20, isFront: true, isRight: false, spinDir: -1 },
          { x: 0.22, z: 0.20, isFront: false, isRight: true, spinDir: -1 },
          { x: -0.22, z: 0.20, isFront: false, isRight: false, spinDir: 1 }
        ];

        motorOffsets.forEach(function (m) {
          var armLen = Math.hypot(m.x, m.z);
          var armMesh = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.025, armLen), armMat);
          armMesh.rotation.y = Math.atan2(m.x, m.z);
          armMesh.position.set(m.x / 2, 0.03, m.z / 2);
          targetGroup.add(armMesh);

          var motorMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.045, 14), motorMat);
          motorMesh.position.set(m.x, 0.045, m.z);
          targetGroup.add(motorMesh);

          var propHub = new THREE.Group();
          propHub.position.set(m.x, 0.072, m.z);
          propHub.add(new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.004, 0.26), propMat));
          propHub.add(new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.015, 8), motorMat));
          targetGroup.add(propHub);
          propsOut.push({ hub: propHub, dir: m.spinDir });

          if (!isGhost) {
            var ledColor = m.isFront ? 0xffffff : (m.isRight ? 0x00ff44 : 0xff2222);
            var ledMesh = new THREE.Mesh(
              new THREE.SphereGeometry(0.018, 8, 8),
              new THREE.MeshBasicMaterial({ color: ledColor })
            );
            ledMesh.position.set(m.x * 0.9, 0.015, m.z * 0.9);
            targetGroup.add(ledMesh);
          }
        });

        if (!isGhost) {
          var skidMat = new THREE.MeshStandardMaterial({ color: 0x141618, roughness: 0.8 });
          var skidGeo = new THREE.BoxGeometry(0.018, 0.012, 0.32);
          var strutGeo = new THREE.BoxGeometry(0.014, 0.075, 0.014);
          [-0.09, 0.09].forEach(function (sx) {
            var skid = new THREE.Mesh(skidGeo, skidMat);
            skid.position.set(sx, -0.05, 0);
            targetGroup.add(skid);
            [-0.10, 0.10].forEach(function (sz) {
              var strut = new THREE.Mesh(strutGeo, skidMat);
              strut.position.set(sx, -0.015, sz);
              targetGroup.add(strut);
            });
          });
          targetGroup.traverse(function (child) {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });
        }
      }

      buildDroneMesh(droneGroup, dronePropellers, false);
      droneGroup.position.set(0, 0.11, 0);
      droneGroup.visible = false;
      scene.add(droneGroup);

      // LED traseiro que pisca em vermelho durante o crash.
      var crashLedMat = new THREE.MeshBasicMaterial({ color: 0xff2222 });
      var crashLed = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), crashLedMat);
      crashLed.position.set(0, 0.10, 0.18);
      droneGroup.add(crashLed);

      // Modelo Ghost translúcido para correr contra o próprio recorde.
      var ghostGroup = new THREE.Group();
      var ghostPropellers = [];
      buildDroneMesh(ghostGroup, ghostPropellers, true);
      ghostGroup.visible = false;
      scene.add(ghostGroup);

      // ── Sistema de partículas de impacto (faíscas + fumaça) ──
      var crashParticles = [];
      var crashShakeTime = 0.0;
      var crashShakeMagnitude = 0.0;

      function spawnCrashEffect(position, impactKmh) {
        var sparkCount = 42;
        var smokeCount = 18;

        for (var i = 0; i < sparkCount; i++) {
          var sparkMat = new THREE.MeshBasicMaterial({
            color: (i % 2 === 0) ? 0xffbb33 : 0xff6622,
            transparent: true,
            opacity: 1.0
          });
          var spark = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, 0.07), sparkMat);
          spark.position.copy(position);
          scene.add(spark);
          var speed = 2.5 + Math.random() * 4.0;
          var theta = Math.random() * Math.PI * 2;
          var phi = Math.random() * Math.PI * 0.5;
          crashParticles.push({
            mesh: spark,
            life: 1.1 + Math.random() * 0.5,
            maxLife: 1.6,
            kind: 'spark',
            vx: Math.cos(theta) * Math.cos(phi) * speed,
            vy: Math.sin(phi) * speed + 1.5,
            vz: Math.sin(theta) * Math.cos(phi) * speed
          });
        }

        for (var j = 0; j < smokeCount; j++) {
          var smokeMat = new THREE.MeshBasicMaterial({
            color: 0x8a8a8a,
            transparent: true,
            opacity: 0.45
          });
          var puff = new THREE.Mesh(new THREE.SphereGeometry(0.16 + Math.random() * 0.12, 6, 6), smokeMat);
          puff.position.copy(position);
          scene.add(puff);
          crashParticles.push({
            mesh: puff,
            life: 1.6 + Math.random(),
            maxLife: 2.6,
            kind: 'smoke',
            vx: (Math.random() * 2 - 1) * 0.8,
            vy: 0.8 + Math.random() * 1.2,
            vz: (Math.random() * 2 - 1) * 0.8
          });
        }

        crashShakeTime = 0.5;
        crashShakeMagnitude = Math.min(0.7, 0.2 + (impactKmh || 0) / 90.0);
      }

      function updateCrashParticles(dt) {
        for (var i = crashParticles.length - 1; i >= 0; i--) {
          var p = crashParticles[i];
          p.life -= dt;
          if (p.life <= 0) {
            scene.remove(p.mesh);
            if (p.mesh.geometry) p.mesh.geometry.dispose();
            p.mesh.material.dispose();
            crashParticles.splice(i, 1);
            continue;
          }
          if (p.kind === 'spark') {
            p.vy -= 9.8 * dt;
          } else {
            p.mesh.scale.multiplyScalar(1.0 + 1.4 * dt);
            p.vy *= 0.99;
          }
          p.mesh.position.x += p.vx * dt;
          p.mesh.position.y += p.vy * dt;
          p.mesh.position.z += p.vz * dt;
          if (p.mesh.position.y < 0.05) {
            p.mesh.position.y = 0.05;
            p.vy = Math.abs(p.vy) * 0.25;
          }
          p.mesh.material.opacity =
            Math.max(0.0, Math.min(1.0, 1.1 * (p.life / p.maxLife)));
        }

        if (crashShakeTime > 0.0) {
          crashShakeTime = Math.max(0.0, crashShakeTime - dt);
        }
      }

      // ── Câmera Dinâmica (FPV vs 3ª Pessoa / Chase Cam + Acro Quaternion) ──
      var cameraTransition = 0.0;          // 0 = FPV, 1 = 3ª pessoa
      var cameraTransitionSpeed = 1.0 / 0.45; // leva ~0.45s
      var chaseSpringPos = new THREE.Vector3(0, 2.2, 5.5);
      var chaseSpringLook = new THREE.Vector3(0, 0.5, 0);
      var chaseInitialized = false;
      var bodyThreeQuat = new THREE.Quaternion();
      var uptiltThreeQuat = new THREE.Quaternion();
      var fpvFullQuat = new THREE.Quaternion();
      var chaseTempCam = new THREE.PerspectiveCamera();
      var lockedChaseYawRad = 0.0;
      var maneuverZoom = 0.0;
      var maneuverHoldTimer = 0.0;
      var droneUpVec = new THREE.Vector3();
      var droneFwdVec = new THREE.Vector3();

      // ── API Exposta para o Flutter ──
      window.updateDroneState = function (jsonState) {
        var data = jsonState;
        if (typeof data === 'string') {
          try {
            data = JSON.parse(data);
          } catch (e) {
            console.error('Falha ao interpretar JSON no updateDroneState:', e);
            return;
          }
        }
        if (!data || typeof data !== 'object') return;

        if (typeof data.x === 'number') droneState.x = data.x;
        if (typeof data.y === 'number') droneState.y = data.y;
        if (typeof data.z === 'number') droneState.z = data.z;
        if (typeof data.yaw === 'number') droneState.yaw = data.yaw;
        if (typeof data.pitch === 'number') droneState.pitch = data.pitch;
        if (typeof data.roll === 'number') droneState.roll = data.roll;
        if (typeof data.visualPitch === 'number') droneState.visualPitch = data.visualPitch;
        if (typeof data.visualRoll === 'number') droneState.visualRoll = data.visualRoll;
        if (typeof data.gimbalPitch === 'number') droneState.gimbalPitch = data.gimbalPitch;
        if (typeof data.cameraMode === 'string') droneState.cameraMode = data.cameraMode;
        if (typeof data.flightMode === 'string') droneState.flightMode = data.flightMode;
        if (typeof data.fpvUptiltDeg === 'number') droneState.fpvUptiltDeg = data.fpvUptiltDeg;
        if (typeof data.audioEnabled === 'boolean') droneState.audioEnabled = data.audioEnabled;
        if (typeof data.speedKmh === 'number') droneState.speedKmh = data.speedKmh;
        if (typeof data.flying === 'boolean') droneState.flying = data.flying;
        if (typeof data.battery === 'number') droneState.battery = data.battery;
        if (typeof data.isArmed === 'boolean') droneState.isArmed = data.isArmed;
        if (typeof data.status === 'string') droneState.status = data.status;
        if (typeof data.impactShake === 'number') droneState.impactShake = data.impactShake;
        if (typeof data.pitchRad === 'number') droneState.pitchRad = data.pitchRad;
        if (typeof data.rollRad === 'number') droneState.rollRad = data.rollRad;
        if (typeof data.yawRad === 'number') droneState.yawRad = data.yawRad;
        if (typeof data.qx === 'number') droneState.qx = data.qx;
        if (typeof data.qy === 'number') droneState.qy = data.qy;
        if (typeof data.qz === 'number') droneState.qz = data.qz;
        if (typeof data.qw === 'number') droneState.qw = data.qw;
        if (data.ghost && typeof data.ghost === 'object') droneState.ghost = data.ghost;
        if (typeof data.crashImpactSpeedKmh === 'number') {
          droneState.crashImpactSpeedKmh = data.crashImpactSpeedKmh;
        }
        var wasCrashed = droneState.isCrashed;
        if (typeof data.isCrashed === 'boolean') droneState.isCrashed = data.isCrashed;
        if (Array.isArray(data.motors) && data.motors.length >= 4) {
          droneState.motors = data.motors.map(function (m) {
            return Math.min(1.0, Math.max(0.0, Number(m) || 0.0));
          });
        }

        updateDroneTransform();
        updateGhostTransform();
        AudioEngine.updateMotors(
          droneState.motors,
          droneState.isArmed,
          droneState.isCrashed,
          droneState.audioEnabled
        );

        if (!wasCrashed && droneState.isCrashed) {
          spawnCrashEffect(droneGroup.position, droneState.crashImpactSpeedKmh);
        }
      };

      function updateDroneTransform() {
        var droneX = droneState.x;
        var droneY = droneState.z;
        var droneZ = -droneState.y;

        droneGroup.position.set(droneX, droneY + 0.11, droneZ);

        var hasQuat = droneState.isArmed &&
          (droneState.qx !== 0.0 || droneState.qy !== 0.0 || droneState.qz !== 0.0);
        if (hasQuat) {
          bodyThreeQuat.set(droneState.qx, droneState.qz, -droneState.qy, droneState.qw).normalize();
          droneGroup.quaternion.copy(bodyThreeQuat);
          return;
        }

        // Orientação física 6-DOF (radianos) tem prioridade sobre os graus antigos.
        var yawRad = Number.isFinite(droneState.yawRad) && droneState.yawRad !== 0.0
          ? droneState.yawRad
          : -(droneState.yaw * Math.PI / 180.0);
        var pitchRad = Number.isFinite(droneState.pitchRad) && droneState.pitchRad !== 0.0
          ? droneState.pitchRad
          : droneState.visualPitch * Math.PI / 180.0;
        var rollRad = Number.isFinite(droneState.rollRad) && droneState.rollRad !== 0.0
          ? -droneState.rollRad
          : -(droneState.visualRoll * Math.PI / 180.0);

        droneGroup.rotation.set(pitchRad, yawRad, rollRad, 'YXZ');
      }

      function updateGhostTransform() {
        var g = droneState.ghost;
        if (!g || !g.active) {
          ghostGroup.visible = false;
          return;
        }
        ghostGroup.visible = true;
        ghostGroup.position.set(g.x || 0, (g.z || 0) + 0.11, -(g.y || 0));
        ghostGroup.rotation.set(
          g.pitchRad || 0,
          g.yawRad || 0,
          -(g.rollRad || 0),
          'YXZ'
        );
      }

      // ── Atualização da Câmera por Frame ──
      function updateCameraFrame(dt) {
        dt = Math.max(0.001, Math.min(dt || 0.016, 0.1));

        var droneX = droneState.x;
        var droneY = droneState.z;
        var droneZ = -droneState.y;

        var yawRad = -(droneState.yaw * Math.PI / 180.0);
        var pitchRad = (droneState.visualPitch + droneState.gimbalPitch) * Math.PI / 180.0;
        var rollRad = -(droneState.visualRoll * Math.PI / 180.0);

        // Transição interpolada (sem teleporte) entre os dois modos.
        var target = droneState.cameraMode === 'thirdPerson' ? 1.0 : 0.0;
        var step = cameraTransitionSpeed * dt;
        if (cameraTransition < target) {
          cameraTransition = Math.min(target, cameraTransition + step);
        } else if (cameraTransition > target) {
          cameraTransition = Math.max(target, cameraTransition - step);
        }
        // smoothstep para entrada/saída suaves
        var blend = cameraTransition * cameraTransition * (3.0 - 2.0 * cameraTransition);

        // ── Pose 1ª pessoa: lente no nariz do drone ──
        var fpvPosX = droneX;
        var fpvPosY = Math.max(0.18, droneY + 0.12);
        var fpvPosZ = droneZ;

        var cosPitch = Math.cos(pitchRad);
        var fpvLookX = droneX - Math.sin(yawRad) * cosPitch * 10.0;
        var fpvLookY = droneY + Math.sin(pitchRad) * 10.0;
        var fpvLookZ = droneZ - Math.cos(yawRad) * cosPitch * 10.0;

        // Detecta manobra 360° (flip / barrel roll / mergulho extremo) para travar
        // o rumo e afastar suavemente a câmera em 3ª pessoa sem girar junto.
        bodyThreeQuat.set(droneState.qx, droneState.qz, -droneState.qy, droneState.qw).normalize();
        droneUpVec.set(0, 1, 0).applyQuaternion(bodyThreeQuat);
        droneFwdVec.set(0, 0, -1).applyQuaternion(bodyThreeQuat);
        var isFlipping360 = droneState.isArmed &&
          (droneUpVec.y < 0.55 || Math.abs(droneFwdVec.y) > 0.78);

        if (!droneState.isArmed) {
          lockedChaseYawRad = yawRad;
          maneuverHoldTimer = 0.0;
        } else if (isFlipping360) {
          maneuverHoldTimer = 0.25;
        } else {
          if (maneuverHoldTimer > 0.0) {
            maneuverHoldTimer = Math.max(0.0, maneuverHoldTimer - dt);
          }
          var horizYaw = Math.atan2(-droneFwdVec.x, -droneFwdVec.z);
          var dyaw = horizYaw - lockedChaseYawRad;
          while (dyaw > Math.PI) dyaw -= Math.PI * 2.0;
          while (dyaw < -Math.PI) dyaw += Math.PI * 2.0;
          lockedChaseYawRad += dyaw * (1.0 - Math.exp(-8.0 * dt));
        }

        var zoomTarget = (isFlipping360 || maneuverHoldTimer > 0.0) ? 1.0 : 0.0;
        var zoomK = zoomTarget > 0.5
          ? (1.0 - Math.exp(-10.0 * dt))
          : (1.0 - Math.exp(-3.0 * dt));
        maneuverZoom += (zoomTarget - maneuverZoom) * zoomK;

        // ── Pose 3ª pessoa: spring-damper com trava de yaw e afastamento em 360° ──
        var effectiveYaw = droneState.isArmed ? lockedChaseYawRad : yawRad;
        var chaseDist = 5.5 + 3.2 * maneuverZoom;
        var chaseHeight = 2.2 + 0.9 * maneuverZoom;
        var lookAhead = 2.0 * (1.0 - maneuverZoom);

        var targetCamX = droneX + Math.sin(effectiveYaw) * chaseDist;
        var targetCamY = Math.max(0.4, droneY + chaseHeight);
        var targetCamZ = droneZ + Math.cos(effectiveYaw) * chaseDist;

        var targetLookX = droneX - Math.sin(effectiveYaw) * lookAhead;
        var targetLookY = droneY + 0.5;
        var targetLookZ = droneZ - Math.cos(effectiveYaw) * lookAhead;

        if (!chaseInitialized) {
          chaseSpringPos.set(targetCamX, targetCamY, targetCamZ);
          chaseSpringLook.set(targetLookX, targetLookY, targetLookZ);
          chaseInitialized = true;
        } else {
          // Mais elástico no plano horizontal (curvas de yaw) e firme na vertical.
          var kXZ = 1.0 - Math.exp(-3.2 * dt);
          var kY = 1.0 - Math.exp(-8.0 * dt);
          chaseSpringPos.x += (targetCamX - chaseSpringPos.x) * kXZ;
          chaseSpringPos.z += (targetCamZ - chaseSpringPos.z) * kXZ;
          chaseSpringPos.y += (targetCamY - chaseSpringPos.y) * kY;

          var kLook = 1.0 - Math.exp(-6.0 * dt);
          chaseSpringLook.x += (targetLookX - chaseSpringLook.x) * kLook;
          chaseSpringLook.y += (targetLookY - chaseSpringLook.y) * kLook;
          chaseSpringLook.z += (targetLookZ - chaseSpringLook.z) * kLook;
        }

        // ── Mistura final entre FPV e 3ª pessoa ──
        camera.position.set(
          fpvPosX + (chaseSpringPos.x - fpvPosX) * blend,
          fpvPosY + (chaseSpringPos.y - fpvPosY) * blend,
          fpvPosZ + (chaseSpringPos.z - fpvPosZ) * blend
        );

        // Em modo ACRO FPV, usa quatérnio completo 3D sem gimbal-lock (flips/rolls de 360° livres).
        var isAcroFpv = droneState.flightMode === 'acro' &&
          droneState.isArmed &&
          blend < 0.99;
        if (isAcroFpv) {
          var tiltRad = ((droneState.fpvUptiltDeg || 0.0) + (droneState.gimbalPitch || 0.0)) * Math.PI / 180.0;
          uptiltThreeQuat.setFromAxisAngle(new THREE.Vector3(1, 0, 0), tiltRad);
          fpvFullQuat.copy(bodyThreeQuat).multiply(uptiltThreeQuat);

          if (blend <= 0.01) {
            camera.quaternion.copy(fpvFullQuat);
          } else {
            chaseTempCam.position.copy(chaseSpringPos);
            chaseTempCam.lookAt(chaseSpringLook);
            chaseTempCam.rotateZ((rollRad * 0.25) * (1.0 - maneuverZoom));
            camera.quaternion.copy(fpvFullQuat).slerp(chaseTempCam.quaternion, blend);
          }
        } else {
          var lookX = fpvLookX + (chaseSpringLook.x - fpvLookX) * blend;
          var lookY = fpvLookY + (chaseSpringLook.y - fpvLookY) * blend;
          var lookZ = fpvLookZ + (chaseSpringLook.z - fpvLookZ) * blend;
          camera.lookAt(lookX, lookY, lookZ);

          // Horizonte inclina apenas de leve na 3ª pessoa (roll * 0.25), e trava reto no 360°.
          var camRoll = rollRad * 0.25 * blend;
          camera.rotateZ(camRoll * (1.0 - maneuverZoom));
        }

        // Efeito leve de FOV dinâmico com velocidade para sensação de imersão.
        var targetFov = 62 + Math.min(18, (droneState.speedKmh || 0) * 0.16);
        if (Math.abs(camera.fov - targetFov) > 0.25) {
          camera.fov += (targetFov - camera.fov) * Math.min(1.0, dt * 6.0);
          camera.updateProjectionMatrix();
        }

        // Farol frontal ligado em modo noturno.
        droneHeadlight.position.set(droneX, droneY + 0.3, droneZ);
        droneHeadlight.intensity = currentLightingPreset === 'night' ? 2.4 : 0.0;

        // Drone visível durante a transição e no modo perseguição.
        droneGroup.visible = cameraTransition > 0.02;

        // Vibração de câmera em impactos (decaimento vem da física em Dart)
        if (crashShakeTime > 0.0) {
          var shakeFactor = (crashShakeTime / 0.5) * crashShakeMagnitude;
          camera.position.x += (Math.random() * 2 - 1) * shakeFactor;
          camera.position.y += (Math.random() * 2 - 1) * shakeFactor;
          camera.position.z += (Math.random() * 2 - 1) * shakeFactor;
          camera.rotateZ((Math.random() * 2 - 1) * 0.06 * shakeFactor);
        }

        if (droneState.impactShake > 0.001) {
          var shake = droneState.impactShake;
          camera.position.x += (Math.random() * 2 - 1) * 0.18 * shake;
          camera.position.y += (Math.random() * 2 - 1) * 0.14 * shake;
          camera.position.z += (Math.random() * 2 - 1) * 0.18 * shake;
          camera.rotateZ((Math.random() * 2 - 1) * 0.02 * shake);
        }
      }

      // ── Portais da corrida (Corrida de Portais & Time Attack) ──
      var raceGroup = new THREE.Group();
      scene.add(raceGroup);
      var raceGates = [];
      var raceActiveIndex = 0;
      var raceModeOn = false;
      var guideArrow = null;

      function clearRaceGates() {
        while (raceGroup.children.length > 0) {
          var child = raceGroup.children.pop();
          if (child.geometry) child.geometry.dispose();
          if (child.material) child.material.dispose();
        }
        raceGates = [];
      }

      function buildRaceGate(gate, isActive, isNext) {
        var color = isActive ? 0x00e5ff : (isNext ? 0x33dd66 : 0x88a0b4);
        var mat = new THREE.MeshBasicMaterial({
          color: color,
          transparent: true,
          opacity: isActive ? 1.0 : (isNext ? 0.55 : 0.22),
          side: THREE.DoubleSide
        });
        var ring = new THREE.Mesh(
          new THREE.TorusGeometry(gate.radius, isActive ? 0.5 : 0.22, 10, 48),
          mat
        );
        ring.position.set(gate.x, gate.z, -gate.y);
        ring.rotation.y = (gate.yaw * Math.PI / 180.0) + Math.PI;
        ring.visible = true;
        raceGroup.add(ring);

        if (isActive) {
          var haloMat = new THREE.MeshBasicMaterial({
            color: 0x00e5ff,
            transparent: true,
            opacity: 0.28,
            side: THREE.DoubleSide
          });
          var halo = new THREE.Mesh(
            new THREE.TorusGeometry(gate.radius + 1.1, 0.9, 8, 40),
            haloMat
          );
          halo.position.copy(ring.position);
          halo.rotation.copy(ring.rotation);
          raceGroup.add(halo);

          for (var i = 0; i < 4; i++) {
            var arrow = new THREE.Mesh(
              new THREE.ConeGeometry(0.35, 0.9, 6),
              new THREE.MeshBasicMaterial({ color: 0xffd166 })
            );
            var angle = (i / 4) * Math.PI * 2;
            arrow.position.set(
              gate.x + Math.cos(angle) * gate.radius,
              gate.z + Math.sin(angle) * gate.radius,
              -gate.y
            );
            arrow.rotation.z = angle + Math.PI;
            raceGroup.add(arrow);
          }
        }
        return ring;
      }

      function buildGateTrail(fromGate, toGate) {
        if (!fromGate || !toGate) return;
        var p1 = new THREE.Vector3(fromGate.x, fromGate.z, -fromGate.y);
        var p2 = new THREE.Vector3(toGate.x, toGate.z, -toGate.y);
        var dir = p2.clone().sub(p1);
        var dist = dir.length();
        if (dist < 4.0) return;
        dir.normalize();
        var steps = Math.min(8, Math.max(3, Math.floor(dist / 14.0)));
        var chevGeo = new THREE.ConeGeometry(0.32, 0.9, 5);
        var chevMat = new THREE.MeshBasicMaterial({
          color: 0x33ff99,
          transparent: true,
          opacity: 0.55
        });
        for (var k = 1; k < steps; k++) {
          var t = k / steps;
          var pos = p1.clone().lerp(p2, t);
          var c = new THREE.Mesh(chevGeo, chevMat);
          c.position.copy(pos);
          c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
          raceGroup.add(c);
        }
      }

      function updateGuideArrow() {
        if (!raceModeOn || raceGates.length === 0) {
          if (guideArrow) guideArrow.visible = false;
          return;
        }
        var gate = raceGates[raceActiveIndex];
        if (!gate) {
          if (guideArrow) guideArrow.visible = false;
          return;
        }

        if (!guideArrow) {
          guideArrow = new THREE.Mesh(
            new THREE.ConeGeometry(0.35, 1.0, 8),
            new THREE.MeshBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.85 })
          );
          scene.add(guideArrow);
        }
        guideArrow.visible = true;
        guideArrow.position.set(
          droneGroup.position.x,
          droneGroup.position.y + 1.6,
          droneGroup.position.z
        );
        var target = new THREE.Vector3(gate.x, gate.z, -gate.y);
        var dir = target.clone().sub(guideArrow.position).normalize();
        guideArrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      }

      /// Recebe circuito e índice do portal ativo do Flutter.
      window.updateRaceState = function (payload) {
        var data = payload;
        if (typeof data === 'string') {
          try {
            data = JSON.parse(data);
          } catch (e) {
            console.error('Falha ao ler o circuito:', e);
            return;
          }
        }
        if (!data) return;

        raceModeOn = !!data.mode && data.mode !== 'freeFlight' && data.mode !== 'freestyle';
        raceActiveIndex = Number(data.activeIndex) || 0;

        clearRaceGates();
        var gates = data.gates || [];
        for (var i = 0; i < gates.length; i++) {
          raceGates.push(gates[i]);
        }

        if (!raceModeOn) {
          if (guideArrow) guideArrow.visible = false;
          return;
        }

        var nextIndex = (raceActiveIndex + 1) % raceGates.length;
        for (var j = 0; j < raceGates.length; j++) {
          var isActive = j === raceActiveIndex;
          var isNext = j === nextIndex;
          buildRaceGate(raceGates[j], isActive, isNext);
        }
        if (raceGates.length > 1) {
          buildGateTrail(raceGates[raceActiveIndex], raceGates[nextIndex]);
        }
      };

      // ── Loop de Renderização e Animação ──
      var lastFrameTime = performance.now();

      function animate() {
        requestAnimationFrame(animate);

        var now = performance.now();
        var frameDt = (now - lastFrameTime) / 1000.0;
        lastFrameTime = now;

        var isSpinning = droneState.flying ||
          droneState.status === 'flying' ||
          droneState.status === 'hovering' ||
          droneState.status === 'takingOff' ||
          droneState.status === 'rth' ||
          droneState.status === 'landing' ||
          droneState.z > 0.05;

        if (droneState.isCrashed) {
          isSpinning = false;
        }
        var motors = droneState.motors || [0.0, 0.0, 0.0, 0.0];
        for (var i = 0; i < dronePropellers.length; i++) {
          var motorNorm = isSpinning
            ? Math.min(1.0, Math.max(0.0, motors[i % 4] || 0.0))
            : 0.0;
          var propSpeed = isSpinning
            ? (6.0 + 46.0 * motorNorm)
            : Math.max(0.0, 0.65 - (droneState.z > 0.05 ? 0.0 : 0.65));
          dronePropellers[i].hub.rotation.y +=
            propSpeed * dronePropellers[i].dir * frameDt;
        }

        if (ghostGroup.visible) {
          for (var g = 0; g < ghostPropellers.length; g++) {
            ghostPropellers[g].hub.rotation.y += 28.0 * ghostPropellers[g].dir * frameDt;
          }
        }

        if (waterMesh.visible) {
          waterMesh.position.y = 0.09 + Math.sin(now * 0.0018) * 0.03;
        }

        updateCrashParticles(frameDt);
        updateGuideArrow();
        if (raceModeOn && raceGroup.children.length > 0) {
          var pulse = 1.0 + 0.06 * Math.sin(performance.now() / 180.0);
          raceGroup.children[0].scale.setScalar(pulse);
        }

        crashLed.visible = !droneState.isCrashed ||
          (Math.floor(performance.now() / 90) % 2 === 0);

        updateCameraFrame(frameDt);
        renderer.render(scene, camera);
      }
      animate();

      // ── Redimensionamento Responsivo ──
      window.addEventListener('resize', function () {
        var w = window.innerWidth;
        var h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      });

      console.log('Câmera dinâmica FPV, Acro 3D, Áudio e Ghost configurados com sucesso.');
    })();
  </script>
</body>
</html>
