<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>Drone Simulator 3D World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0b1118;
      touch-action: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <script src="three.min.js"></script>
  <script>
    (function () {
      'use strict';

      // ── Estado Global do Drone ──
      var droneState = {
        x: 0.0,
        y: 0.0,
        z: 0.0,
        yaw: 0.0,
        pitch: 0.0,
        roll: 0.0,
        visualPitch: 0.0,
        visualRoll: 0.0,
        gimbalPitch: 0.0,
        cameraMode: 'fpv', // 'fpv' ou 'thirdPerson'
        flying: false,
        battery: 100.0,
        isArmed: false,
        status: 'landed'
      };

      // ── Cena, Câmera e Renderizador Three.js ──
      var container = document.getElementById('canvas-container');
      var scene = new THREE.Scene();
      scene.background = new THREE.Color(0x8cb5df);
      scene.fog = new THREE.FogExp2(0x8cb5df, 0.0015);

      var camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
      camera.rotation.order = 'YXZ';
      camera.position.set(0, 1.8, 4.5);

      var renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: false,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      container.appendChild(renderer.domElement);

      // ── Iluminação Atmosférica ──
      var hemiLight = new THREE.HemisphereLight(0xdff0ff, 0x3d502a, 0.65);
      hemiLight.position.set(0, 500, 0);
      scene.add(hemiLight);

      var sunLight = new THREE.DirectionalLight(0xfffaee, 1.25);
      sunLight.position.set(160, 340, 180);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      sunLight.shadow.camera.near = 10;
      sunLight.shadow.camera.far = 1000;
      sunLight.shadow.camera.left = -450;
      sunLight.shadow.camera.right = 450;
      sunLight.shadow.camera.top = 450;
      sunLight.shadow.camera.bottom = -450;
      sunLight.shadow.bias = -0.0003;
      scene.add(sunLight);

      // ── Geração Procedural da Textura do Terreno (Grama + Estradas + Pista) ──
      function createGroundTexture() {
        var size = 2048;
        var canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        var ctx = canvas.getContext('2d');

        var grad = ctx.createRadialGradient(size / 2, size / 2, 50, size / 2, size / 2, size * 0.7);
        grad.addColorStop(0, '#588a3e');
        grad.addColorStop(0.5, '#4f7d37');
        grad.addColorStop(1, '#446e2f');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);

        ctx.fillStyle = 'rgba(70, 110, 40, 0.25)';
        for (var i = 0; i < 200; i++) {
          var rx = (Math.sin(i * 997) * 0.5 + 0.5) * size;
          var ry = (Math.cos(i * 613) * 0.5 + 0.5) * size;
          var rw = 30 + ((i * 17) % 80);
          var rh = 20 + ((i * 31) % 60);
          ctx.beginPath();
          ctx.ellipse(rx, ry, rw, rh, (i * 0.4), 0, Math.PI * 2);
          ctx.fill();
        }

        var scale = size / 1600.0;
        var centerX = size / 2;
        var centerY = size / 2;

        var runwayWidth = 240 * scale;
        var runwayHeight = 36 * scale;
        var runwayX = centerX - runwayWidth / 2;
        var runwayY = centerY - 140 * scale;

        ctx.fillStyle = '#4a5057';
        ctx.fillRect(runwayX, runwayY, runwayWidth, runwayHeight);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2 * scale;
        ctx.strokeRect(runwayX + 2, runwayY + 2, runwayWidth - 4, runwayHeight - 4);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2 * scale;
        ctx.setLineDash([8 * scale, 6 * scale]);
        ctx.beginPath();
        ctx.moveTo(runwayX + 15 * scale, runwayY + runwayHeight / 2);
        ctx.lineTo(runwayX + runwayWidth - 15 * scale, runwayY + runwayHeight / 2);
        ctx.stroke();
        ctx.setLineDash([]);

        var roadWidth = 18 * scale;
        ctx.fillStyle = '#32363b';
        ctx.fillRect(centerX - roadWidth / 2, 0, roadWidth, size);
        ctx.fillRect(0, centerY - roadWidth / 2, size, roadWidth);

        var ringRadius = 240 * scale;
        ctx.strokeStyle = '#32363b';
        ctx.lineWidth = 12 * scale;
        ctx.beginPath();
        ctx.arc(centerX, centerY, ringRadius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = '#e6b800';
        ctx.lineWidth = 1.5 * scale;
        ctx.setLineDash([6 * scale, 6 * scale]);

        ctx.beginPath();
        ctx.moveTo(centerX, 0);
        ctx.lineTo(centerX, size);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, centerY);
        ctx.lineTo(size, centerY);
        ctx.stroke();
        ctx.setLineDash([]);

        var texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.ClampToEdgeWrapping;
        texture.wrapT = THREE.ClampToEdgeWrapping;
        return texture;
      }

      var groundGeo = new THREE.PlaneGeometry(1600, 1600);
      groundGeo.rotateX(-Math.PI / 2);
      var groundMat = new THREE.MeshStandardMaterial({
        map: createGroundTexture(),
        roughness: 0.88,
        metalness: 0.08
      });
      var ground = new THREE.Mesh(groundGeo, groundMat);
      ground.receiveShadow = true;
      scene.add(ground);

      var gridHelper = new THREE.GridHelper(1600, 80, 0x6e9060, 0x5a7850);
      gridHelper.position.y = 0.02;
      scene.add(gridHelper);

      // ── Heliponto Home (0, 0, 0) com "H" Amarelo e Balizamento ──
      function createHelipad() {
        var helipadGroup = new THREE.Group();
        helipadGroup.position.set(0, 0.03, 0);

        var padGeo = new THREE.CylinderGeometry(7.0, 7.2, 0.08, 36);
        var padMat = new THREE.MeshStandardMaterial({
          color: 0x484d52,
          roughness: 0.8,
          metalness: 0.15
        });
        var pad = new THREE.Mesh(padGeo, padMat);
        pad.receiveShadow = true;
        helipadGroup.add(pad);

        var ringGeo = new THREE.RingGeometry(5.2, 5.6, 36);
        ringGeo.rotateX(-Math.PI / 2);
        var yellowMat = new THREE.MeshBasicMaterial({
          color: 0xffcc00,
          side: THREE.DoubleSide
        });
        var ring = new THREE.Mesh(ringGeo, yellowMat);
        ring.position.y = 0.045;
        helipadGroup.add(ring);

        var hBarGeo1 = new THREE.PlaneGeometry(0.7, 4.4);
        hBarGeo1.rotateX(-Math.PI / 2);
        var barLeft = new THREE.Mesh(hBarGeo1, yellowMat);
        barLeft.position.set(-1.4, 0.046, 0);
        helipadGroup.add(barLeft);

        var barRight = new THREE.Mesh(hBarGeo1, yellowMat);
        barRight.position.set(1.4, 0.046, 0);
        helipadGroup.add(barRight);

        var hBarGeo2 = new THREE.PlaneGeometry(2.1, 0.7);
        hBarGeo2.rotateX(-Math.PI / 2);
        var barCross = new THREE.Mesh(hBarGeo2, yellowMat);
        barCross.position.set(0, 0.047, 0);
        helipadGroup.add(barCross);

        var beaconMatGreen = new THREE.MeshBasicMaterial({ color: 0x00ff66 });
        var beaconMatAmber = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        var beaconPositions = [
          { x: 5.8, z: 0, mat: beaconMatGreen },
          { x: -5.8, z: 0, mat: beaconMatGreen },
          { x: 0, z: 5.8, mat: beaconMatAmber },
          { x: 0, z: -5.8, mat: beaconMatAmber },
          { x: 4.1, z: 4.1, mat: beaconMatAmber },
          { x: -4.1, z: 4.1, mat: beaconMatAmber },
          { x: 4.1, z: -4.1, mat: beaconMatAmber },
          { x: -4.1, z: -4.1, mat: beaconMatAmber }
        ];

        var beaconPostGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8);
        var beaconCapGeo = new THREE.SphereGeometry(0.14, 8, 8);
        var postMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });

        beaconPositions.forEach(function (bp) {
          var post = new THREE.Mesh(beaconPostGeo, postMat);
          post.position.set(bp.x, 0.2, bp.z);
          helipadGroup.add(post);

          var cap = new THREE.Mesh(beaconCapGeo, bp.mat);
          cap.position.set(bp.x, 0.42, bp.z);
          helipadGroup.add(cap);
        });

        scene.add(helipadGroup);
      }
      createHelipad();

      // ── Gerador Determinístico (Seed Fixa) ──
      function createPrng(seed) {
        var s = seed;
        return function () {
          s = (s + 0x6D2B79F5) | 0;
          var t = Math.imul(s ^ (s >>> 15), 1 | s);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      var rand = createPrng(20261119);

      // ── Cidade Low-Poly ──
      function buildLowPolyCity() {
        var buildingGroup = new THREE.Group();

        var buildingColors = [
          0x4a6572, 0x34495e, 0x2c3e50, 0x5d6d7e,
          0x7f8c8d, 0x95a5a6, 0x3a4b53, 0x2e4053
        ];
        var roofColors = [0x22313f, 0x1a252f, 0x283747, 0x212f3d];

        function makeFacadeTexture(baseColorHex) {
          var canvas = document.createElement('canvas');
          canvas.width = 256;
          canvas.height = 512;
          var ctx = canvas.getContext('2d');

          ctx.fillStyle = '#' + ('000000' + baseColorHex.toString(16)).slice(-6);
          ctx.fillRect(0, 0, 256, 512);

          var rows = 16;
          var cols = 8;
          var w = 18;
          var h = 18;
          var padX = (256 - cols * w) / (cols + 1);
          var padY = (512 - rows * h) / (rows + 1);

          for (var r = 0; r < rows; r++) {
            for (var c = 0; c < cols; c++) {
              var x = padX + c * (w + padX);
              var y = padY + r * (h + padY);

              var lightUp = rand() > 0.45;
              ctx.fillStyle = lightUp ? 'rgba(255, 240, 180, 0.75)' : 'rgba(30, 45, 60, 0.85)';
              ctx.fillRect(x, y, w, h);
            }
          }

          var tex = new THREE.CanvasTexture(canvas);
          tex.wrapS = THREE.RepeatWrapping;
          tex.wrapT = THREE.RepeatWrapping;
          return tex;
        }

        var facadeTextures = buildingColors.map(function (c) {
          return makeFacadeTexture(c);
        });

        var buildingCount = 70;
        var placed = 0;

        for (var i = 0; i < 300 && placed < buildingCount; i++) {
          var angle = rand() * Math.PI * 2;
          var dist = 35 + rand() * 440;
          var bx = Math.cos(angle) * dist;
          var bz = Math.sin(angle) * dist;

          if (Math.hypot(bx, bz) < 26) continue;
          if (Math.abs(bz - (-110)) < 35 && Math.abs(bx) < 160) continue;
          if (Math.abs(bx) < 16 || Math.abs(bz) < 16) continue;
          if (Math.hypot(bx - 120, bz - 280) < 85) continue;

          var bWidth = 16 + rand() * 22;
          var bDepth = 16 + rand() * 22;
          var bHeight = 18 + rand() * 68;

          var colorIdx = Math.floor(rand() * buildingColors.length);
          var bMat = new THREE.MeshStandardMaterial({
            map: facadeTextures[colorIdx],
            roughness: 0.65,
            metalness: 0.2
          });

          var bGeo = new THREE.BoxGeometry(bWidth, bHeight, bDepth);
          var bMesh = new THREE.Mesh(bGeo, bMat);
          bMesh.position.set(bx, bHeight / 2, bz);
          bMesh.castShadow = true;
          bMesh.receiveShadow = true;
          buildingGroup.add(bMesh);

          if (rand() > 0.4) {
            var roofGeo = new THREE.BoxGeometry(bWidth * 0.4, 3, bDepth * 0.4);
            var roofMat = new THREE.MeshStandardMaterial({
              color: roofColors[Math.floor(rand() * roofColors.length)],
              roughness: 0.9
            });
            var roofBox = new THREE.Mesh(roofGeo, roofMat);
            roofBox.position.set(bx, bHeight + 1.5, bz);
            roofBox.castShadow = true;
            buildingGroup.add(roofBox);
          }

          placed++;
        }

        scene.add(buildingGroup);
      }
      buildLowPolyCity();

      // ── Árvores Low-Poly ──
      function buildLowPolyTrees() {
        var treeGroup = new THREE.Group();

        var trunkGeo = new THREE.CylinderGeometry(0.35, 0.55, 3.2, 6);
        var trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.9 });

        var foliageGeo1 = new THREE.ConeGeometry(2.8, 5.5, 6);
        var foliageGeo2 = new THREE.ConeGeometry(2.2, 4.2, 6);
        var foliageMat1 = new THREE.MeshStandardMaterial({ color: 0x2e6b2e, roughness: 0.8 });
        var foliageMat2 = new THREE.MeshStandardMaterial({ color: 0x3d7e3d, roughness: 0.8 });
        var foliageMat3 = new THREE.MeshStandardMaterial({ color: 0x245824, roughness: 0.8 });
        var foliageMats = [foliageMat1, foliageMat2, foliageMat3];

        var treeCount = 140;
        var placed = 0;

        for (var i = 0; i < 400 && placed < treeCount; i++) {
          var angle = rand() * Math.PI * 2;
          var dist = 14 + rand() * 460;
          var tx = Math.cos(angle) * dist;
          var tz = Math.sin(angle) * dist;

          if (Math.hypot(tx, tz) < 9) continue;
          if (Math.abs(tx) < 11 || Math.abs(tz) < 11) continue;
          if (Math.abs(tz - (-110)) < 26 && Math.abs(tx) < 140) continue;

          var treeScale = 0.75 + rand() * 0.6;
          var treeSingle = new THREE.Group();
          treeSingle.position.set(tx, 0, tz);
          treeSingle.scale.set(treeScale, treeScale, treeScale);

          var trunk = new THREE.Mesh(trunkGeo, trunkMat);
          trunk.position.y = 1.6;
          trunk.castShadow = true;
          treeSingle.add(trunk);

          var folMat = foliageMats[Math.floor(rand() * foliageMats.length)];
          var folBottom = new THREE.Mesh(foliageGeo1, folMat);
          folBottom.position.y = 4.8;
          folBottom.castShadow = true;
          treeSingle.add(folBottom);

          var folTop = new THREE.Mesh(foliageGeo2, folMat);
          folTop.position.y = 7.2;
          folTop.castShadow = true;
          treeSingle.add(folTop);

          treeGroup.add(treeSingle);
          placed++;
        }

        scene.add(treeGroup);
      }
      buildLowPolyTrees();

      // ── Torre de Rádio ──
      function buildTowersAndPoles() {
        var group = new THREE.Group();

        var towerX = -220;
        var towerZ = -180;
        var towerH = 45;

        var latticeMat = new THREE.MeshStandardMaterial({
          color: 0xdd3333,
          metalness: 0.6,
          roughness: 0.4
        });
        var latticeWhiteMat = new THREE.MeshStandardMaterial({
          color: 0xeeeeee,
          metalness: 0.5,
          roughness: 0.5
        });

        var sections = 6;
        var secH = towerH / sections;
        for (var s = 0; s < sections; s++) {
          var rTop = 2.4 * (1 - (s + 1) / (sections + 1));
          var rBot = 2.4 * (1 - s / (sections + 1));
          var secGeo = new THREE.CylinderGeometry(rTop, rBot, secH, 4, 1, true);
          var sMesh = new THREE.Mesh(secGeo, (s % 2 === 0) ? latticeMat : latticeWhiteMat);
          sMesh.position.set(towerX, secH * (s + 0.5), towerZ);
          sMesh.castShadow = true;
          group.add(sMesh);
        }

        var beaconLight = new THREE.Mesh(
          new THREE.SphereGeometry(0.6, 8, 8),
          new THREE.MeshBasicMaterial({ color: 0xff0000 })
        );
        beaconLight.position.set(towerX, towerH + 0.5, towerZ);
        group.add(beaconLight);

        scene.add(group);
      }
      buildTowersAndPoles();

      // ── Barreira Geofence e Zonas No-Fly ──
      function buildGeofenceAndNoFlyZones() {
        var safetyGroup = new THREE.Group();

        var fenceRadius = 500.0;
        var fenceHeight = 240.0;
        var fenceGeo = new THREE.CylinderGeometry(fenceRadius, fenceRadius, fenceHeight, 64, 1, true);
        var fenceMat = new THREE.MeshBasicMaterial({
          color: 0xff2222,
          transparent: true,
          opacity: 0.14,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        var fence = new THREE.Mesh(fenceGeo, fenceMat);
        fence.position.set(0, fenceHeight / 2, 0);
        safetyGroup.add(fence);

        var ringGroundGeo = new THREE.RingGeometry(fenceRadius - 3.0, fenceRadius + 3.0, 64);
        ringGroundGeo.rotateX(-Math.PI / 2);
        var ringGroundMat = new THREE.MeshBasicMaterial({
          color: 0xff3333,
          side: THREE.DoubleSide
        });
        var ringGround = new THREE.Mesh(ringGroundGeo, ringGroundMat);
        ringGround.position.y = 0.15;
        safetyGroup.add(ringGround);

        var ringTopGeo = new THREE.RingGeometry(fenceRadius - 2.0, fenceRadius + 2.0, 64);
        ringTopGeo.rotateX(-Math.PI / 2);
        var ringTop = new THREE.Mesh(ringTopGeo, ringGroundMat);
        ringTop.position.y = fenceHeight;
        safetyGroup.add(ringTop);

        var nfzX = 120.0;
        var nfzZ = 280.0;
        var nfzR = 75.0;
        var nfzH = 160.0;

        var nfzGeo = new THREE.CylinderGeometry(nfzR, nfzR, nfzH, 36, 1, true);
        var nfzMat = new THREE.MeshBasicMaterial({
          color: 0xff1100,
          transparent: true,
          opacity: 0.26,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        var nfzCylinder = new THREE.Mesh(nfzGeo, nfzMat);
        nfzCylinder.position.set(nfzX, nfzH / 2, nfzZ);
        safetyGroup.add(nfzCylinder);

        var nfzRingGeo = new THREE.RingGeometry(nfzR - 2.5, nfzR + 2.5, 36);
        nfzRingGeo.rotateX(-Math.PI / 2);
        var nfzRing = new THREE.Mesh(nfzRingGeo, new THREE.MeshBasicMaterial({ color: 0xff1100, side: THREE.DoubleSide }));
        nfzRing.position.set(nfzX, 0.18, nfzZ);
        safetyGroup.add(nfzRing);

        scene.add(safetyGroup);
      }
      buildGeofenceAndNoFlyZones();

      // ── Modelo 3D do Drone ──
      var droneGroup = new THREE.Group();
      droneGroup.rotation.order = 'YXZ';
      var dronePropellers = [];

      function buildDroneModel() {
        var bodyMat = new THREE.MeshStandardMaterial({
          color: 0x24282c,
          roughness: 0.4,
          metalness: 0.35
        });
        var accentMat = new THREE.MeshStandardMaterial({
          color: 0x00d4ff,
          roughness: 0.3,
          metalness: 0.6
        });
        var armMat = new THREE.MeshStandardMaterial({
          color: 0x181a1c,
          roughness: 0.6,
          metalness: 0.5
        });
        var motorMat = new THREE.MeshStandardMaterial({
          color: 0x8a929a,
          roughness: 0.25,
          metalness: 0.85
        });
        var propMat = new THREE.MeshStandardMaterial({
          color: 0x151515,
          roughness: 0.3,
          metalness: 0.2,
          transparent: true,
          opacity: 0.85
        });

        // 1. Corpo Central Aerodinâmico
        var bodyTopGeo = new THREE.BoxGeometry(0.22, 0.08, 0.36);
        var bodyTop = new THREE.Mesh(bodyTopGeo, bodyMat);
        bodyTop.position.y = 0.04;
        bodyTop.castShadow = true;
        droneGroup.add(bodyTop);

        var stripeGeo = new THREE.BoxGeometry(0.06, 0.02, 0.32);
        var stripe = new THREE.Mesh(stripeGeo, accentMat);
        stripe.position.set(0, 0.085, 0);
        stripe.castShadow = true;
        droneGroup.add(stripe);

        var gimbalBase = new THREE.Mesh(
          new THREE.SphereGeometry(0.045, 12, 12),
          new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9 })
        );
        gimbalBase.position.set(0, -0.01, -0.19);
        gimbalBase.castShadow = true;
        droneGroup.add(gimbalBase);

        var lensMesh = new THREE.Mesh(
          new THREE.CylinderGeometry(0.02, 0.02, 0.025, 12),
          new THREE.MeshBasicMaterial({ color: 0x00ffcc })
        );
        lensMesh.rotation.x = Math.PI / 2;
        lensMesh.position.set(0, -0.01, -0.22);
        droneGroup.add(lensMesh);

        // 2. Braços em 'X' e Motores
        var motorOffsets = [
          { x: 0.22, z: -0.20, isFront: true, isRight: true, spinDir: 1 },
          { x: -0.22, z: -0.20, isFront: true, isRight: false, spinDir: -1 },
          { x: 0.22, z: 0.20, isFront: false, isRight: true, spinDir: -1 },
          { x: -0.22, z: 0.20, isFront: false, isRight: false, spinDir: 1 }
        ];

        motorOffsets.forEach(function (m) {
          var armLen = Math.hypot(m.x, m.z);
          var armGeo = new THREE.BoxGeometry(0.035, 0.025, armLen);
          var armMesh = new THREE.Mesh(armGeo, armMat);
          var armAngle = Math.atan2(m.x, m.z);
          armMesh.rotation.y = armAngle;
          armMesh.position.set(m.x / 2, 0.03, m.z / 2);
          armMesh.castShadow = true;
          droneGroup.add(armMesh);

          var motorGeo = new THREE.CylinderGeometry(0.032, 0.032, 0.045, 14);
          var motorMesh = new THREE.Mesh(motorGeo, motorMat);
          motorMesh.position.set(m.x, 0.045, m.z);
          motorMesh.castShadow = true;
          droneGroup.add(motorMesh);

          var propHub = new THREE.Group();
          propHub.position.set(m.x, 0.072, m.z);

          var bladeGeo = new THREE.BoxGeometry(0.022, 0.004, 0.26);
          var bladeMesh = new THREE.Mesh(bladeGeo, propMat);
          bladeMesh.castShadow = true;
          propHub.add(bladeMesh);

          var nutGeo = new THREE.CylinderGeometry(0.012, 0.012, 0.015, 8);
          var nutMesh = new THREE.Mesh(nutGeo, motorMat);
          nutMesh.position.y = 0.008;
          propHub.add(nutMesh);

          droneGroup.add(propHub);
          dronePropellers.push({
            hub: propHub,
            dir: m.spinDir
          });

          var ledColor = m.isFront ? 0xffffff : (m.isRight ? 0x00ff44 : 0xff2222);
          var ledGeo = new THREE.SphereGeometry(0.018, 8, 8);
          var ledMat = new THREE.MeshBasicMaterial({ color: ledColor });
          var ledMesh = new THREE.Mesh(ledGeo, ledMat);
          ledMesh.position.set(m.x * 0.9, 0.015, m.z * 0.9);
          droneGroup.add(ledMesh);
        });

        // 3. Trem de Pouso
        var skidMat = new THREE.MeshStandardMaterial({ color: 0x141618, roughness: 0.8 });
        var skidGeo = new THREE.BoxGeometry(0.018, 0.012, 0.32);
        var strutGeo = new THREE.BoxGeometry(0.014, 0.075, 0.014);

        [-0.09, 0.09].forEach(function (sx) {
          var skid = new THREE.Mesh(skidGeo, skidMat);
          skid.position.set(sx, -0.05, 0);
          skid.castShadow = true;
          droneGroup.add(skid);

          [-0.10, 0.10].forEach(function (sz) {
            var strut = new THREE.Mesh(strutGeo, skidMat);
            strut.position.set(sx, -0.015, sz);
            strut.castShadow = true;
            droneGroup.add(strut);
          });
        });

        droneGroup.traverse(function (child) {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        droneGroup.position.set(0, 0.11, 0);
        // Inicialmente em modo FPV, droneGroup fica oculto
        droneGroup.visible = false;
        scene.add(droneGroup);
      }
      buildDroneModel();

      // ── Câmera Dinâmica (FPV vs 3ª Pessoa / Chase Cam) ──
      var chaseCamPos = new THREE.Vector3(0, 1.8, 4.5);
      var chaseCamLook = new THREE.Vector3(0, 0.5, 0);
      var hasSnapped = false;

      // ── API Exposta para o Flutter ──
      window.updateDroneState = function (jsonState) {
        var data = jsonState;
        if (typeof data === 'string') {
          try {
            data = JSON.parse(data);
          } catch (e) {
            console.error('Falha ao interpretar JSON no updateDroneState:', e);
            return;
          }
        }
        if (!data || typeof data !== 'object') return;

        if (typeof data.x === 'number') droneState.x = data.x;
        if (typeof data.y === 'number') droneState.y = data.y;
        if (typeof data.z === 'number') droneState.z = data.z;
        if (typeof data.yaw === 'number') droneState.yaw = data.yaw;
        if (typeof data.pitch === 'number') droneState.pitch = data.pitch;
        if (typeof data.roll === 'number') droneState.roll = data.roll;
        if (typeof data.visualPitch === 'number') droneState.visualPitch = data.visualPitch;
        if (typeof data.visualRoll === 'number') droneState.visualRoll = data.visualRoll;
        if (typeof data.gimbalPitch === 'number') droneState.gimbalPitch = data.gimbalPitch;
        if (typeof data.cameraMode === 'string') droneState.cameraMode = data.cameraMode;
        if (typeof data.flying === 'boolean') droneState.flying = data.flying;
        if (typeof data.battery === 'number') droneState.battery = data.battery;
        if (typeof data.isArmed === 'boolean') droneState.isArmed = data.isArmed;
        if (typeof data.status === 'string') droneState.status = data.status;

        updateDroneTransform();
      };

      function updateDroneTransform() {
        var droneX = droneState.x;
        var droneY = droneState.z;
        var droneZ = -droneState.y;

        droneGroup.position.set(droneX, droneY + 0.11, droneZ);

        var yawRad = -(droneState.yaw * Math.PI / 180.0);
        var pitchRad = droneState.visualPitch * Math.PI / 180.0;
        var rollRad = -(droneState.visualRoll * Math.PI / 180.0);

        droneGroup.rotation.set(pitchRad, yawRad, rollRad, 'YXZ');
      }

      // ── Atualização da Câmera por Frame ──
      function updateCameraFrame() {
        var droneX = droneState.x;
        var droneY = droneState.z;
        var droneZ = -droneState.y;

        var yawRad = -(droneState.yaw * Math.PI / 180.0);
        var pitchRad = (droneState.visualPitch + droneState.gimbalPitch) * Math.PI / 180.0;
        var rollRad = -(droneState.visualRoll * Math.PI / 180.0);

        if (droneState.cameraMode === 'thirdPerson') {
          // Modo 3ª Pessoa: droneGroup visível
          droneGroup.visible = true;

          // Câmera 4.5m atrás e 1.8m acima do drone
          var dist = 4.5;
          var height = 1.8;
          var targetCamX = droneX + Math.sin(yawRad) * dist;
          var targetCamY = Math.max(0.4, droneY + height);
          var targetCamZ = droneZ + Math.cos(yawRad) * dist;

          // Ponto de foco: ligeiramente à frente do drone e no horizonte
          var lookDist = 2.0;
          var targetLookX = droneX - Math.sin(yawRad) * lookDist;
          var targetLookY = droneY + 0.5;
          var targetLookZ = droneZ - Math.cos(yawRad) * lookDist;

          var targetCamVec = new THREE.Vector3(targetCamX, targetCamY, targetCamZ);
          var targetLookVec = new THREE.Vector3(targetLookX, targetLookY, targetLookZ);

          if (!hasSnapped) {
            chaseCamPos.copy(targetCamVec);
            chaseCamLook.copy(targetLookVec);
            hasSnapped = true;
          } else {
            // Interpolação suave lerp para sensação cinematográfica de perseguição
            chaseCamPos.lerp(targetCamVec, 0.10);
            chaseCamLook.lerp(targetLookVec, 0.12);
          }

          camera.position.copy(chaseCamPos);
          camera.lookAt(chaseCamLook);
        } else {
          // Modo 1ª Pessoa (FPV): ocultar a malha do próprio drone
          droneGroup.visible = false;
          hasSnapped = false;

          // Câmera posicionada na lente no nariz do drone
          camera.position.set(droneX, Math.max(0.18, droneY + 0.12), droneZ);
          // Rotação com Yaw, Roll e GimbalPitch (0° no horizonte até -90° no Nadir)
          camera.rotation.set(pitchRad, yawRad, rollRad, 'YXZ');
        }
      }

      // ── Loop de Renderização e Animação ──
      function animate() {
        requestAnimationFrame(animate);

        // Animação contínua das hélices quando o drone está ativo
        var isSpinning = droneState.flying ||
          droneState.status === 'flying' ||
          droneState.status === 'hovering' ||
          droneState.status === 'takingOff' ||
          droneState.status === 'rth' ||
          droneState.status === 'landing' ||
          droneState.z > 0.05;

        if (isSpinning) {
          var spinSpeed = 0.65;
          for (var i = 0; i < dronePropellers.length; i++) {
            dronePropellers[i].hub.rotation.y += spinSpeed * dronePropellers[i].dir;
          }
        }

        updateCameraFrame();
        renderer.render(scene, camera);
      }
      animate();

      // ── Redimensionamento Responsivo ──
      window.addEventListener('resize', function () {
        var w = window.innerWidth;
        var h = window.innerHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      });

      console.log('Câmera dinâmica FPV e 3ª Pessoa configurada com sucesso.');
    })();
  </script>
</body>
</html>
